<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slop Blocker - Settings</title>
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <div class="header-content">
          <h1>🛡️ Slop Blocker</h1>
          <p class="subtitle">Manage your blocked sites</p>
        </div>
        <nav>
          <a href="/pages/stats/stats.html" class="nav-link">📊 Statistics</a>
        </nav>
      </header>

      <main>
        <!-- Global Toggle -->
        <section class="card">
          <div class="toggle-row">
            <div>
              <h2>Blocking Enabled</h2>
              <p class="description">Turn blocking on or off globally</p>
            </div>
            <label class="switch">
              <input type="checkbox" id="globalToggle" checked />
              <span class="slider"></span>
            </label>
          </div>
        </section>

        <!-- Add New Rule -->
        <section class="card">
          <h2>Add New Block Rule</h2>
          <form id="addRuleForm">
            <div class="form-group">
              <label for="pattern">Website to Block</label>
              <input
                type="text"
                id="pattern"
                placeholder="e.g., twitter.com or youtube.com/shorts/*"
                required
              />
            </div>

            <div class="form-group">
              <label for="ruleType">Match Type</label>
              <select id="ruleType">
                <option value="domain">Domain (blocks entire site)</option>
                <option value="url">URL Pattern (with wildcards)</option>
                <option value="regex">Regular Expression</option>
              </select>
            </div>

            <!-- Time Schedule Section -->
            <div class="form-group">
              <label class="schedule-toggle-label">
                <input type="checkbox" id="enableSchedule" />
                <span>Enable time-based blocking</span>
              </label>
            </div>

            <div id="scheduleOptions" class="schedule-options hidden">
              <div class="form-row">
                <div class="form-group half">
                  <label for="startTime">Start Time</label>
                  <input type="time" id="startTime" value="09:00" />
                </div>
                <div class="form-group half">
                  <label for="endTime">End Time</label>
                  <input type="time" id="endTime" value="18:00" />
                </div>
              </div>

              <div class="form-group">
                <label>Active Days</label>
                <div class="days-selector">
                  <label class="day-checkbox">
                    <input type="checkbox" name="days" value="0" />
                    <span>Sun</span>
                  </label>
                  <label class="day-checkbox">
                    <input type="checkbox" name="days" value="1" checked />
                    <span>Mon</span>
                  </label>
                  <label class="day-checkbox">
                    <input type="checkbox" name="days" value="2" checked />
                    <span>Tue</span>
                  </label>
                  <label class="day-checkbox">
                    <input type="checkbox" name="days" value="3" checked />
                    <span>Wed</span>
                  </label>
                  <label class="day-checkbox">
                    <input type="checkbox" name="days" value="4" checked />
                    <span>Thu</span>
                  </label>
                  <label class="day-checkbox">
                    <input type="checkbox" name="days" value="5" checked />
                    <span>Fri</span>
                  </label>
                  <label class="day-checkbox">
                    <input type="checkbox" name="days" value="6" />
                    <span>Sat</span>
                  </label>
                </div>
              </div>
            </div>

            <button type="submit" class="btn btn-primary">Add Rule</button>
          </form>

          <div id="formError" class="error-message hidden"></div>
        </section>

        <!-- Blocked Sites List -->
        <section class="card">
          <h2>Blocked Sites</h2>
          <div id="rulesList" class="rules-list">
            <p class="empty-state">
              No sites blocked yet. Add your first rule above!
            </p>
          </div>
        </section>
      </main>

      <footer>
        <p>Slop Blocker v1.0.0 • Stay focused! 💪</p>
      </footer>
    </div>

    <script src="admin.js" type="module"></script>
  </body>
</html>
